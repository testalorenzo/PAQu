[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PAQu"
version = "1.0.0"
description = "Bayesian protein isoform abundance quantification from mass-spectrometry data"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Lorenzo Testa", email = "tstlnz11@gmail.com"}
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "tqdm>=4.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.3"]
app  = ["pandas>=1.2", "networkx>=2.5", "joblib>=1.0"]

[project.urls]
Homepage   = "https://github.com/testalorenzo/PAQu"
Paper      = "https://doi.org/10.64898/2026.04.20.719668"
Website    = "https://testalorenzo.github.io/PAQu_web/"

[tool.setuptools.packages.find]
where   = ["."]
include = ["PAQu*"]
